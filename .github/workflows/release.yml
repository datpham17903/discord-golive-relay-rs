name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds and checksums every target without publishing a release.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Experimental targets may fail without blocking the other artifacts or the release.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner: glibc 2.35, so the binary also runs on Debian 12 (2.36) and
          # Ubuntu 22.04+ (ubuntu-latest links against glibc 2.39 symbols).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            experimental: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            experimental: false
          - os: macos-latest
            target: aarch64-apple-darwin
            experimental: false
          # Native arm64 runner, same steps as x86_64 Linux (glibc 2.35).
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            experimental: true
          # Static binary, cross-compiled from a glibc host (build scripts such as bindgen need a
          # dynamic libclang, which a crt-static musl host cannot load) with a musl gcc/g++.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            experimental: true
            musl: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        if: ${{ !matrix.musl }}
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # wreq -> btls-sys builds BoringSSL: needs cmake, NASM (Windows) and libclang (bindgen).
      - name: Native build deps (Linux)
        if: runner.os == 'Linux' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Native build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Native build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        if: ${{ !matrix.musl }}
        run: cargo build --release -p relayctl --target ${{ matrix.target }}
      - name: Build (static musl, musl-cross container)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD:/home/rust/src" -w /home/rust/src \
            messense/rust-musl-cross:x86_64-musl sh -euc '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake libclang-dev
            rustup target add ${{ matrix.target }}
            cargo build --release -p relayctl --target ${{ matrix.target }}
            file target/${{ matrix.target }}/release/relayctl || true'
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="relayctl-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/relayctl" "dist/$name/"
          cp -r config.example.yaml manifests README.md LICENSE NOTICE "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "relayctl-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/relayctl.exe" "dist/$name/"
          Copy-Item -Recurse config.example.yaml, manifests, README.md, LICENSE, NOTICE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"
      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -FilePath "$env:ASSET.sha256" -Encoding ascii
          Get-Content "$env:ASSET.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
