name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # wreq -> btls-sys builds BoringSSL: needs cmake, NASM (Windows) and libclang (bindgen).
      - name: Native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Native build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Native build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        run: cargo build --release -p relayctl --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="relayctl-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/relayctl" "dist/$name/"
          cp -r config.example.yaml manifests README.md LICENSE NOTICE "dist/$name/"
          rm -f "dist/$name/manifests/verified-profiles.json"
          tar -czf "$name.tar.gz" -C dist "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "relayctl-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/relayctl.exe" "dist/$name/"
          Copy-Item -Recurse config.example.yaml, manifests, README.md, LICENSE, NOTICE "dist/$name/"
          Remove-Item "dist/$name/manifests/verified-profiles.json" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          prerelease: ${{ contains(github.ref_name, '-') }}
